# KlipperConnect for a Prusa MINI / MINI+ running Klipper.
# Copy to <printer_data>/config/klipper_connect.conf and set serial_number.
# See klipper_connect.conf.example for every option.
#
# Experimental: Connect normally sees MINIs running Prusa's Buddy firmware.
# This reports the same printer type (2.1.0), but Connect may expect
# Buddy-only features. Check `journalctl -u klipper-connect` for commands
# that fail.

[printer]
# The CZPX... serial number on the MINI's sticker
serial_number: CZPX0000X000XC00000
type: MINI
part_fan: fan
hotend_fan: heater_fan extruder_fan
# Connect shows this as the MINI's firmware and warns that versions older
# than Buddy's current release are deprecated (it said 8.0.0 at the time
# of writing). Empty = Klipper's version.
#firmware_version:

[connect]
hostname: connect.prusa3d.com
tls: True

[moonraker]
# Default: the port from the moonraker.conf next to this file
#url: http://127.0.0.1:7125

[storage]
# Connect expects a MINI's files on its USB drive: /usb/...
name: usb

[macros]
load_filament: LOAD_FILAMENT
unload_filament: UNLOAD_FILAMENT
# The MINI's filament macros take the temperature as EXTRUDER=<C>
filament_temp_param: EXTRUDER
mbl_gcode: G80

[camera]
# crowsnest [cam 1] serves snapshots on port 8080. Uncomment once a camera
# is plugged in (otherwise Connect gets a camera that never sends images).
#snapshot_url: http://127.0.0.1:8080/?action=snapshot
name: MINI webcam
trigger: 30

[bridge]
# Connect asks for a MINI's folders itself, so don't push file details
file_info_count: 0
log_level: INFO
