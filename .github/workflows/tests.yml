name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Run in the official Python images rather than the runner's Python:
    # newer runner images drop old versions (Ubuntu 26.04 has no 3.9), and
    # 3.9 still matters because Raspberry Pi OS Bullseye ships it.
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Check install script syntax
        run: bash -n scripts/install.sh
